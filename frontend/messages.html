
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Messages | Nepal Crisis Response Hub</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .messaging-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .conversation-list,
        .chat-panel {
            background: white;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            padding: 20px;
        }

        .chat-history {
            height: 380px;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .sent {
            align-self: flex-end;
            background: #1d4ed8;
            color: white;
        }

        .received {
            align-self: flex-start;
            background: #e2e8f0;
            color: #0f172a;
        }

        .chat-time {
            display: block;
            font-size: 11px;
            margin-top: 6px;
            opacity: 0.8;
        }

        .conversation-button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 12px;
            text-align: left;
            border-radius: 8px;
        }

        #messageForm {
            margin-top: 15px;
        }

        #messageText {
            width: 100%;
            min-height: 80px;
        }

        @media (max-width: 700px) {
            .messaging-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="workspace-page">

<header>
    <div class="container nav">
        <h1 class="site-brand">Nepal Crisis Response Hub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="messages.html">Messages</a>    
            <a href="login.html" id="messageLogout">Logout</a>
            <button type="button" id="languageToggle"
                    class="language-toggle"></button>
        </nav>
    </div>
</header>

<main class="section">
    <div class="container">

        <h2>Private Messages</h2>

        <p>Communicate directly with the administrator.</p>

        <p class="prototype-warning">
            Classroom simulation only. Messages are stored
            in this browser and do not contact real emergency services.
        </p>

        <div class="messaging-layout">

            <aside class="conversation-list">

                <h3>Conversations</h3>

                <div id="conversationList"></div>

            </aside>

            <section class="chat-panel">

                <h3 id="chatTitle">Select a conversation</h3>

                <div id="chatHistory"
                     class="chat-history"
                     role="log"
                     aria-live="polite">
                    <p>No conversation selected.</p>
                </div>

                <form id="messageForm" hidden>

                    <label for="messageText">
                        Write a message
                    </label>

                    <textarea
                        id="messageText"
                        placeholder="Type your message..."
                        maxlength="1000"
                        required
                    ></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

                <p id="messageStatus" role="status"></p>

            </section>

        </div>

    </div>
</main>

<script src="js/language.js"></script>
<script src="js/accounts.js"></script>
<script src="js/messages.js"></script>
<script src="js/message-notifications.js"></script>
</body>
</html>
